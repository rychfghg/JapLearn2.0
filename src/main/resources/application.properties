spring.application.name=Japlearn

# MongoDB - provide these through environment variables in production.
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:japlearn}

# Brevo SMTP - credentials are injected only at runtime.
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_LOGIN}
spring.mail.password=${BREVO_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Public links placed in confirmation and password-reset emails.
app.backend-url=${APP_BACKEND_URL:http://localhost:8080}
app.student-web-url=${APP_STUDENT_WEB_URL:https://japlearn.com}
app.mail.from-address=${MAIL_FROM_ADDRESS:japlearnofficial@gmail.com}

# CORS allow-list used by SecurityConfig. Comma separated, no trailing
# slashes. Add a Render/Vercel preview URL here (via the ALLOWED_ORIGINS env
# var) if you ever need one temporarily — do not widen this to "*".
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://japlearn.com,https://www.japlearn.com,https://portal.japlearn.com,http://localhost:8081,http://localhost:19006,http://localhost:5173,http://localhost:3000}

spring.servlet.multipart.enabled=true
# Was 200MB, which is a free denial-of-service lever (a handful of
# concurrent 200MB uploads can exhaust memory/disk on a small Render
# instance). 15MB comfortably covers admin content images/audio uploads.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Render supplies PORT automatically. Local development continues to use 8080.
server.address=0.0.0.0
server.port=${PORT:8080}

logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:INFO}
logging.level.org.springframework.boot.autoconfigure.web.servlet=${SPRING_WEB_LOG_LEVEL:INFO}
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=${SPRING_WEB_LOG_LEVEL:INFO}
logging.level.org.apache.tomcat=${TOMCAT_LOG_LEVEL:INFO}
