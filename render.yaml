services:
  - type: web
    name: japlearn-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: japlearn
      - key: BREVO_SMTP_LOGIN
        sync: false
      - key: BREVO_SMTP_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: MAIL_FROM_ADDRESS
        value: japlearnofficial@gmail.com
      - key: APP_BACKEND_URL
        sync: false
      - key: APP_FRONTEND_URL
        sync: false
      - key: SPRING_WEB_LOG_LEVEL
        value: INFO
      - key: TOMCAT_LOG_LEVEL
        value: INFO
