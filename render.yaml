services:
  - type: web
    name: japlearn-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: japlearn
      - key: BREVO_SMTP_LOGIN
        sync: false
      - key: BREVO_SMTP_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: MAIL_FROM_ADDRESS
        value: japlearnofficial@gmail.com
      - key: APP_BACKEND_URL
        sync: false
      - key: APP_STUDENT_WEB_URL
        value: https://japlearn.com
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        value: southeastasia
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: gemini-2.5-flash-native-audio-preview-12-2025
      - key: SUMI_GEMINI_VOICE
        value: Aoede
      - key: SPRING_WEB_LOG_LEVEL
        value: INFO
      - key: TOMCAT_LOG_LEVEL
        value: INFO
